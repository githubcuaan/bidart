name: bidart
description: "Bidart application."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
    
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1

  cupertino_icons: ^1.0.8
  freezed_annotation: ^3.1.0
  json_annotation: ^4.12.0
  uuid: ^4.5.1
  flutter_riverpod: ^3.4.3
  drift: ^2.35.2
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.6
  path: ^1.9.1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  shared_preferences: ^2.5.6
dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^4.0.2
  json_serializable: ^6.14.1
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  flutter_launcher_icons: ^0.14.4

flutter:
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800

  uses-material-design: true

# Cấu hình sinh icon (dart run flutter_launcher_icons)
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "docs/branding/export/icon-a-1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0F131D"
  adaptive_icon_foreground: "docs/branding/export/icon-a-foreground-1024.png"
  adaptive_icon_foreground_inset: 0
  web:
    generate: false
