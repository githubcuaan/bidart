<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="ballBase" cx="34%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EDE8DC"/>
    </radialGradient>
    <radialGradient id="shade" cx="35%" cy="28%" r="92%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.18"/>
    </radialGradient>
    <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFD953"/>
      <stop offset="100%" stop-color="#F1A63A"/>
    </linearGradient>
    <clipPath id="ballClip"><circle r="85"/></clipPath>
    <radialGradient id="ballBig" cx="100%" cy="100%" r="80%">
      <stop offset="0%" stop-color="#FFDFAF"/>
      <stop offset="45%" stop-color="#FFC166"/>
      <stop offset="100%" stop-color="#F0A032"/>
    </radialGradient>
  </defs>

  <!-- Nền dark theo UI (#0F131D) -->
  <rect width="512" height="512" rx="115" fill="#0F131D"/>

  <!-- Vòng "0" đặc trưng zero-sum: tổng điểm mọi người luôn = 0 -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="#4EDEA3" stroke-width="44"/>

  <!-- Bi số 9 nguyên mẫu nằm trong vòng "0" -->
  <!-- Bi 9: đổi size bằng cách sửa con số scale() bên dưới (1 = chuẩn) -->
  <g transform="translate(256,256) scale(1)">
    <circle r="85" fill="url(#ballBase)"/>
    <g clip-path="url(#ballClip)">
      <rect x="-85" y="-34" width="170" height="68" fill="url(#band)"/>
      <circle r="85" fill="url(#shade)"/>
    </g>
    <circle r="32" fill="#FAF8F2" stroke="#E4DECC" stroke-width="2"/>
    <ellipse cx="-13" cy="-15" rx="9" ry="6" fill="#FFFFFF" opacity="0.85"
             transform="rotate(-35 -13 -15)"/>
    <text y="4" text-anchor="middle" dominant-baseline="central"
          font-family="Plus Jakarta Sans, Segoe UI, Arial, sans-serif"
          font-size="68" font-weight="800" fill="#10141E">9</text>
    <!-- Viền đen quanh bi -->
    <circle r="85" fill="none" stroke="#10141E" stroke-width="6"/>
  </g>
</svg>
