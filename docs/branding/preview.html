<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bidart Logo Preview</title>
<style>
  body { background:#0f131d; color:#dfe2f1; font-family:"Plus Jakarta Sans","Segoe UI",sans-serif;
         margin:0; padding:40px; display:flex; flex-direction:column; gap:48px; align-items:center; }
  h1 { font-size:22px; font-weight:800; margin:0; }
  h2 { font-size:14px; font-weight:600; color:#bbcabf; text-transform:uppercase; letter-spacing:2px; margin:0 0 12px; }
  .row { display:flex; gap:32px; align-items:flex-end; flex-wrap:wrap; justify-content:center; }
  .cell { text-align:center; }
  .cell img { display:block; margin:0 auto 8px; border-radius:16px; }
  img.round { border-radius:24%; }
  img.allgreen { border-radius:50%; }
  .light { background:#f4f4f5; border-radius:16px; padding:20px; }
</style>
</head>
<body>
  <h1>Bidart — logo preview (Concept 2: vòng "0" zero-sum)</h1>

  <div>
    <h2>Biến thể A — đường bi + bi 9 lăn vào lỗ (pocket)</h2>
    <div class="row">
      <div class="cell"><img class="round" src="bidart-logo-icon-a.svg" width="160" height="160"><div>160px</div></div>
      <div class="cell"><img class="round" src="bidart-logo-icon-a.svg" width="96" height="96"><div>96px</div></div>
      <div class="cell"><img class="round" src="bidart-logo-icon-a.svg" width="48" height="48"><div>48px</div></div>
      <div class="cell"><img src="bidart-logo-icon-a.svg" width="120" height="120"><div>góc vuông (icon địa chỉ web)</div></div>
    </div>
  </div>

  <div>
    <h2>Biến thể B — "9" trong vòng "0"</h2>
    <div class="row">
      <div class="cell"><img class="round" src="bidart-logo-icon-b.svg" width="160" height="160"><div>160px</div></div>
      <div class="cell"><img class="round" src="bidart-logo-icon-b.svg" width="96" height="96"><div>96px</div></div>
      <div class="cell"><img class="round" src="bidart-logo-icon-b.svg" width="48" height="48"><div>48px</div></div>
    </div>
  </div>

  <div style="width:100%; max-width:900px;">
    <h2>Wordmark</h2>
    <img src="bidart-logo-wordmark.svg" style="width:100%; border-radius:24px;" alt="Bidart wordmark">
  </div>

  <div>
    <h2>Kiểm tra trên nền sáng</h2>
    <div class="light">
      <div class="row">
        <div class="cell"><img class="round" src="bidart-logo-icon-a.svg" width="80" height="80"><div>A 80px</div></div>
        <div class="cell"><img class="round" src="bidart-logo-icon-b.svg" width="80" height="80"><div>B 80px</div></div>
      </div>
    </div>
  </div>
</body>
</html>
